<script>
(function() {
  'use strict';

  function track(eventName, params) {
    if (typeof gtag === 'function') {
      gtag('event', eventName, params);
    }
  }

  document.addEventListener('click', function(e) {
    var el = e.target.closest('a, button');
    if (!el) return;
    var text = el.textContent.trim();
    var href = el.getAttribute('href') || '';

    if (text.match(/list\s+my\s+property/i) || href.includes('/list')) {
      track('cta_click', { cta_label: 'list_my_property', cta_location: getSection(el), cta_href: href });
    }
    if (text.match(/view\s+a\s+listing/i)) {
      track('cta_click', { cta_label: 'view_a_listing', cta_location: getSection(el), cta_href: href });
    }
    if (text.match(/list\s+for/i) || text.match(/\$798/)) {
      track('cta_click', { cta_label: 'list_for_798', cta_location: getSection(el), cta_href: href });
    }
    if (el.closest('nav')) {
      track('nav_click', { nav_item: text, nav_href: href });
    }
    if (href && href.startsWith('http') && !href.includes('no-agents.com.au')) {
      track('outbound_click', { outbound_url: href, outbound_label: text.substring(0, 50) });
    }
  });

  var sliderTimer;
  document.addEventListener('input', function(e) {
    if (e.target.type === 'range') {
      clearTimeout(sliderTimer);
      sliderTimer = setTimeout(function() {
        track('calculator_interaction', { slider_value: parseInt(e.target.value), slider_label: e.target.getAttribute('aria-label') || 'price_slider' });
      }, 800);
    }
  });

  document.addEventListener('click', function(e) {
    var details = e.target.closest('details');
    var summary = e.target.closest('summary');
    if (summary || details) {
      var questionEl = (details || summary.parentElement).querySelector('summary, h3, p');
      var question = questionEl ? questionEl.textContent.trim().substring(0, 80) : 'unknown';
      track('faq_open', { faq_question: question });
    }
  });

  var scrollMilestones = [25, 50, 75, 90, 100];
  var firedMilestones = {};
  window.addEventListener('scroll', function() {
    var scrollTop = window.scrollY || document.documentElement.scrollTop;
    var docHeight = document.documentElement.scrollHeight - window.innerHeight;
    var scrollPct = Math.round((scrollTop / docHeight) * 100);
    scrollMilestones.forEach(function(milestone) {
      if (scrollPct >= milestone && !firedMilestones[milestone]) {
        firedMilestones[milestone] = true;
        track('scroll_depth', { scroll_percent: milestone });
      }
    });
  }, { passive: true });

  var sections = [
    { selector: '#pricing, [id*="pricing"], .pricing', label: 'pricing' },
    { selector: '#how-it-works, [id*="how"], .steps', label: 'how_it_works' },
    { selector: '#calculator, [id*="calculator"], .calculator', label: 'calculator' },
    { selector: '#why, [id*="why"], .myths', label: 'why_no_agent' },
    { selector: '#faq, [id*="faq"], .faq', label: 'faq' },
  ];
  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          track('section_view', { section_label: entry.target.dataset.analyticsSection });
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.3 });
    document.addEventListener('DOMContentLoaded', function() {
      sections.forEach(function(s) {
        var el = document.querySelector(s.selector);
        if (el) { el.dataset.analyticsSection = s.label; observer.observe(el); }
      });
    });
  }

  [30, 60, 120].forEach(function(seconds) {
    setTimeout(function() { track('time_on_page', { seconds_on_page: seconds }); }, seconds * 1000);
  });

  function getSection(el) {
    var sectionEl = el.closest('section, header, footer, [id], [data-section]');
    if (!sectionEl) return 'unknown';
    return sectionEl.id || sectionEl.dataset.section || sectionEl.tagName.toLowerCase();
  }
})();
</script>

          ${demoTab==='income'&&html`<div style="padding:24px">

        <div style="text-align:center;margin-top:16px;font-size:12px;color:${T.tu}">This is a demo of the investor dashboard. Data shown is illustrative only.</div>

    </section>`}

    <section style="background:${showDash?T.bg:'#fff'};border-top:1px solid ${T.bd};border-bottom:1px solid ${T.bd};padding:48px 32px" class="mp" id="frac-sellers">
      <div style="max-width:900px;margin:0 auto">
        <div style="text-align:center;margin-bottom:40px"><h2 class="sf" style="font-size:32px;font-weight:600;letter-spacing:-.5px;margin-bottom:12px">Homeowners: free up equity without selling</h2><p style="font-size:15px;color:${T.tm};max-width:500px;margin:0 auto;line-height:1.7">Sell a portion of your home to unlock capital. Keep living there. Stay in control.</p></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px" class="g1">
          <div style="${CD}">
            <h3 class="sf" style="font-size:18px;font-weight:600;margin-bottom:16px">The process</h3>
            <ul style="list-style:none;display:grid;gap:10px">${['Decide what percentage to sell (e.g. 10% = 1,000 Slices)','We set up a unit trust structure for the property','A conveyancer registers the trust on the title','We list the Slices on our platform','Investors purchase Slices — you receive funds','If owner-occupied, you pay fair market rent to the trust monthly — independently assessed and distributed to investors','Buy back Slices later on the marketplace if you choose'].map((s,i)=>html`<li style="display:flex;gap:10px;align-items:flex-start;font-size:13px;color:${T.tm}"><span style="width:22px;height:22px;border-radius:50%;background:${T.k};color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0">${i+1}</span>${s}</li>`)}</ul>
          </div>
          <div style="${CD}">
            <h3 class="sf" style="font-size:18px;font-weight:600;margin-bottom:16px">Why this works</h3>
            <ul style="list-style:none;display:grid;gap:10px">${['You hold the bulk of ownership — lower risk for everyone','Stay in your home — no need to sell and move out','Investors get a real asset backed by property','Trust structure provides full legal protection','75%+ vote required for any full sale — you retain control','Occupancy fee gives investors a return even when you live there'].map(s=>html`<li style="display:flex;gap:8px;align-items:flex-start;font-size:13px;color:${T.tm}"><span style="color:${T.g};flex-shrink:0">✓</span>${s}</li>`)}</ul>
          </div>
        </div>
        ${!sellerSent?html`<div style="${CD};max-width:600px;margin:0 auto">
          <h3 class="sf" style="font-size:20px;font-weight:600;margin-bottom:8px">Homeowner expression of interest</h3>
          <p style="font-size:14px;color:${T.tm};margin-bottom:20px;line-height:1.6">Interested in releasing equity? Tell us about your situation.</p>
          ${[['Full name','name','text','Jane Smith'],['Email','email','email','jane@email.com'],['Mobile','phone','tel','04XX XXX XXX'],['Property address','address','text','e.g. 12 Smith St, Brisbane']].map(([l,k,t,ph])=>html`<div style="margin-bottom:14px"><label style="${LB}">${l}</label><input style="${IS}" type=${t} value=${sellerForm[k]} onInput=${e=>sUp(k,e.target.value)} placeholder=${ph}/></div>`)}
          <div style="margin-bottom:14px"><label style="${LB}">Percentage you'd consider selling</label><select style="${IS}" value=${sellerForm.percent} onChange=${e=>sUp('percent',e.target.value)}>${['5','10','15','20','25','30'].map(p=>html`<option value=${p}>${p}%</option>`)}</select></div>
          <div style="margin-bottom:14px"><label style="${LB}">Will you continue living there?</label>
            <div style="display:flex;gap:8px">${[['tenanted','No — property is tenanted'],['occupied','Yes — I live here']].map(([v,l])=>html`<button onclick=${()=>sUp('occupancy',v)} style="${B(sellerForm.occupancy===v?'p':'o')};flex:1;font-size:13px">${l}</button>`)}</div>
            ${sellerForm.occupancy==='occupied'&&html`<div style="font-size:12px;color:${T.tm};margin-top:8px;line-height:1.5;padding:10px 12px;background:${T.bw};border-radius:8px;border:1px solid ${T.bdd}">As an owner-occupier, you'll pay a fair market occupancy fee to the trust each month (independently assessed). This is distributed to your investors and ensures they earn a return while you continue living in the property.</div>`}
          </div>
          <button style="${B('p','l')};width:100%;opacity:${sellerForm.name&&sellerForm.email&&sellerForm.phone&&sellerForm.address?1:.5}" onclick=${()=>sellerForm.name&&sellerForm.email&&sellerForm.phone&&sellerForm.address&&setSellerSent(true)} disabled=${!(sellerForm.name&&sellerForm.email&&sellerForm.phone&&sellerForm.address)}>Submit expression of interest →</button>
        </div>`:html`<div style="${CD};max-width:600px;margin:0 auto;text-align:center;padding:40px"><div style="font-size:40px;margin-bottom:12px">✅</div><h3 class="sf" style="font-size:22px;font-weight:600;margin-bottom:8px">Expression of interest received</h3><p style="font-size:14px;color:${T.tm}">We'll be in touch within 2 business days at <strong>${sellerForm.email}</strong>.</p></div>`}
      </div>
    </section>

    <section style="padding:48px 32px" class="mp">
      <div style="max-width:900px;margin:0 auto">
        <div style="text-align:center;margin-bottom:40px"><h2 class="sf" style="font-size:28px;font-weight:600;letter-spacing:-.5px">Common questions</h2></div>
        ${faqs.map(([q,a],i)=>html`<div style="border-bottom:1px solid ${T.bd}"><button onclick=${()=>setFaq(faq===i?null:i)} style="width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 0;background:none;border:none;cursor:pointer;text-align:left;gap:16px;font-family:Inter,sans-serif"><span style="font-size:15px;font-weight:500;color:${T.t}">${q}</span><span style="color:${T.tu};font-size:18px;flex-shrink:0;transition:transform .2s;transform:${faq===i?'rotate(45deg)':'none'}">+</span></button>${faq===i&&html`<div style="padding-bottom:16px;font-size:14px;color:${T.tm};line-height:1.7">${a}</div>`}</div>`)}
      </div>
    </section>

    <section style="background:${T.k};padding:64px 32px;text-align:center" class="mp" id="frac-eoi">
      <div style="max-width:560px;margin:0 auto">
        <h2 class="sf" style="font-size:32px;font-weight:600;color:#fff;letter-spacing:-.5px;margin-bottom:16px">Register your interest</h2>

        ${!eoiSent?html`<div style="text-align:left">
          ${[['Full name','name','text','Jane Smith'],['Email','email','email','jane@email.com'],['Mobile','phone','tel','04XX XXX XXX']].map(([l,k,t,ph])=>html`<div style="margin-bottom:14px"><label style="${LB};color:rgba(255,255,255,.5)">${l}</label><input style="${IS}" type=${t} value=${eoiForm[k]} onInput=${e=>eUp(k,e.target.value)} placeholder=${ph}/></div>`)}
          <div style="margin-bottom:14px"><label style="${LB};color:rgba(255,255,255,.5)">I'm interested as a</label><select style="${IS}" value=${eoiForm.interest} onChange=${e=>eUp('interest',e.target.value)}><option value="buyer">Investor</option><option value="seller">Homeowner (sell a stake)</option><option value="both">Both</option></select></div>
          <button style="${B('a','l')};width:100%;margin-top:8px;opacity:${eoiForm.name&&eoiForm.email?1:.5}" onclick=${()=>eoiForm.name&&eoiForm.email&&setEoiSent(true)} disabled=${!(eoiForm.name&&eoiForm.email)}>Register →</button>
        </div>`:html`<div style="padding:20px"><div style="font-size:40px;margin-bottom:12px">✅</div><h3 class="sf" style="font-size:22px;font-weight:600;color:#fff;margin-bottom:8px">You're on the list</h3><p style="font-size:14px;color:rgba(255,255,255,.6)">We'll notify you at <strong style="color:#fff">${eoiForm.email}</strong> when fractional ownership launches.</p></div>`}
      </div>
    </section>
  </div>`;}

function App(){
  const initView=()=>{
    if(window.location.hash==='#agentmanagement')return 'admin';
    if(window.location.pathname.startsWith('/offer/'))return 'buy';
    return 'home';
  };
  const[view,setView]=useState(initView());
  const[legalPage,setLegalPage]=useState('privacy');
  const go=v=>{setView(v);window.scrollTo(0,0);};
  const gl=p=>setLegalPage(p);
  return html`<div>
    <${Nav} v=${view} go=${go} gl=${gl}/>
    <div style="min-height:80vh">
      ${view==='home'&&html`<${Home} go=${go}/>`}
      ${view==='sell'&&html`<${Sell}/>`}
      ${view==='buy'&&html`<${Buy}/>`}
      ${view==='fractional'&&html`<${Fractional} go=${go}/>`}
      ${view==='dash'&&html`<${Dash} go=${go}/>`}
      ${view==='agents'&&html`<${Agents} go=${go}/>`}
      ${view==='legal'&&html`<${Legal} page=${legalPage}/>`}
      ${view==='admin'&&html`<${Admin}/>`}
    </div>
    <${Footer} go=${go} gl=${gl}/>
  </div>`;}

render(html`<${App}/>`,document.getElementById('app'));
</script>
</body>
